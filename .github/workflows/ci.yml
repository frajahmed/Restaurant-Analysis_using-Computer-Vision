# Runs on every push and pull request:
#   1. the logic tests (no YOLO needed)
#   2. a full Docker build plus a smoke test of the running dashboard
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.8 = oldest supported version (e.g. existing PyCharm environments), 3.12 = Docker image.
        python: ["3.8", "3.12"]
    name: tests (Python ${{ matrix.python }})
    steps:
      - uses: actions/checkout@v4
      - name: Install Python ${{ matrix.python }} and test dependencies
        run: |
          pip install uv
          uv python install ${{ matrix.python }}
          uv venv -p ${{ matrix.python }} .venv
          uv pip install -p .venv/bin/python numpy opencv-python-headless
      - name: Run logic tests
        run: .venv/bin/python main.py test
      - name: Load every module and script
        run: |
          .venv/bin/python - <<'PY'
          import runpy, sys, pathlib, importlib
          sys.path.insert(0, ".")
          for m in ["rcv", "app.db"]:
              importlib.import_module(m)
          for f in sorted(pathlib.Path(".").glob("phase[12]/*.py")) + [pathlib.Path("tools/mark_tables.py")]:
              runpy.run_path(str(f), run_name="check")
          print("all modules load on", sys.version.split()[0])
          PY

  docker:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t restaurant-analysis .

      - name: Start container (same volume setup as docker-compose.yml)
        run: |
          docker volume create restaurant-data
          docker run -d --name app -p 8000:8000 \
            -v restaurant-data:/app/data \
            -v "$PWD/videos:/app/videos:ro" \
            restaurant-analysis

      - name: Wait for the dashboard
        run: |
          for i in $(seq 1 45); do
            if curl -fs http://localhost:8000/api/stats > /dev/null; then
              echo "Dashboard is up after $((i * 2)) s"; exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' app)" != "true" ]; then
              echo "Container stopped"; exit 1
            fi
            sleep 2
          done
          echo "Dashboard did not answer within 90 s"; exit 1

      - name: Check pages and API
        run: |
          curl -fs http://localhost:8000/ | grep -q "Restaurant"
          curl -fs http://localhost:8000/settings | grep -q "Tische"
          curl -fs http://localhost:8000/api/config | grep -q '"tables"'
          curl -fs http://localhost:8000/api/stats
          echo
          curl -fs http://localhost:8000/api/history | grep -q '"hour"'
          docker exec app test -f /app/data/config.json

      - name: End-to-end test with the real YOLO models (pipeline + learning steps)
        shell: bash
        run: |
          set -o pipefail
          docker run --rm restaurant-analysis python tests/e2e_yolo.py 2>&1 | tee e2e.log
          # Key results as annotations on the run summary page.
          grep -E "Pipeline:|bestanden" e2e.log | sed 's/^ */::notice title=E2E::/'

      - name: Dashboard with a real video (settings API → restart → live numbers)
        run: |
          docker exec app python tests/e2e_yolo.py --make-video /app/data/e2e.mp4
          curl -fs -X POST http://localhost:8000/api/config -H "Content-Type: application/json" -d '{
            "source": "/app/data/e2e.mp4",
            "tables": [
              {"id": "L", "seats": 4, "polygon": [[0, 0], [640, 0], [640, 720], [0, 720]]},
              {"id": "R", "seats": 4, "polygon": [[640, 0], [1280, 0], [1280, 720], [640, 720]]}
            ]}'
          echo
          for i in $(seq 1 60); do
            stats=$(curl -fs http://localhost:8000/api/stats || true)
            people=$(echo "$stats" | jq -r '.people_total // 0')
            if [ "$people" -ge 2 ]; then
              echo "Live numbers after $((i * 2)) s:"
              echo "::notice title=Dashboard::$(echo "$stats" | jq -c '{running, error, fps, people_total, standing, guests, tables_occupied, tables_total}')"
              break
            fi
            sleep 2
          done
          [ "$people" -ge 2 ] || { echo "No people detected: $stats"; exit 1; }
          echo "$stats" | jq -e '.error == null and .running == true' > /dev/null
          echo "$stats" | jq -e '[.tables[].id] == ["L", "R"]' > /dev/null
          # Video stream and still frame deliver JPEG data.
          curl -fs -o snap.jpg http://localhost:8000/api/snapshot && file snap.jpg | grep -q JPEG
          bytes=$(curl -s --max-time 3 http://localhost:8000/video | wc -c || true)
          echo "MJPEG bytes in 3 s: $bytes"; [ "$bytes" -gt 10000 ]
          # The setting was persisted in the data volume.
          docker exec app grep -q e2e.mp4 /app/data/config.json

      - name: Report container output on failure
        if: failure()
        run: |
          docker ps -a || true
          # Annotations are visible on the run summary page.
          docker logs app 2>&1 | tail -15 | sed 's/^/::error title=docker logs::/' || true
          [ -f e2e.log ] && tail -15 e2e.log | sed 's/^/::error title=e2e::/' || true
